# S2Q with an HLL lattice/PMIX monotone mixer for every successive sub-value
# Capacity-matched S2Q settings: preserve the three branches,
# central critic, and encoder-decoder while keeping total model
# capacity close to the QMIX/PMIX comparison budget.
# head. The centralized unrestricted S2Q branch remains S2QCentralMixer.
# Optimisation settings match the PyMARL QMIX/PMIX SMACv1 protocol.
action_selector: "s2q_epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0
runner: "episode"
batch_size_run: 1
common_reward: True
buffer_size: 5000
batch_size: 32
optimizer: "rmsprop"
lr: 0.0005
target_update_interval: 200
agent_output_type: "q"
learner: "s2q_learner"
mac: "s2q_mac"
agent: "s2q_rnn"
double_q: True
mixer: "s2q_pmix_lattice"
rnn_hidden_dim: 16
obs_agent_id: True
obs_last_action: True

s2q_k: 2
s2q_temperature: 0.1
s2q_alpha: 1.0
w_c: 0.9
central_action_embed: 1
central_mixing_embed_dim: 32
s2q_hidden_dim: 16
s2q_central_hidden_dim: 16
s2q_encoder_hidden_dim: 16
s2q_latent_dim: 8
s2q_central_use_agent_id: True
s2q_central_use_last_action: True
s2q_mixing_embed_dim: 16
s2q_hypernet_embed: 32

mixer_diagnostics: True
credit_near_zero_threshold: 0.0001
hll_vertex_delta_near_zero_threshold: 0.0001
hll_lattice_size: 2
hll_max_vertices: 4096
hll_q_groups: null
hll_q_groups_by_map:
  bane_vs_bane: 10
  27m_vs_30m: 10
hll_q_grouping: "sorted"
hll_q_grouping_by_map:
  bane_vs_bane: "contiguous"
  27m_vs_30m: "sorted"
hll_lattice_size_by_map:
  MMM2: 2
  3s_vs_5z: 6
  2s3z: 4
  3s5z: [3, 3, 3, 2, 2, 2, 2, 2]
  1c3s5z: [3, 3, 3, 3, 2, 2, 2, 2, 2]
  5m_vs_6m: 4
  bane_vs_bane: 2
  2c_vs_64zg: 16
  27m_vs_30m: 2
hll_q_coordinate_fn: "sigmoid"
hll_q_softsign_scale: 2.0
hll_q_temperature: 1.0
hll_q_temperature_by_map:
  MMM2: 1.0
  3s_vs_5z: 1.0
  2s3z: 1.0
  3s5z: 1.0
  1c3s5z: 1.0
  5m_vs_6m: 1.0
  bane_vs_bane: 1.0
  2c_vs_64zg: 1.0
  27m_vs_30m: 1.0
hll_q_calibrator_enabled: False
hll_q_calibrator_init_shift: 0.0
hll_q_calibrator_init_scale: 1.0
hll_q_calibrator_min_scale: 0.25
hll_aux_hidden_dim: 64
hll_aux_depth: 2
hll_aux_activation: "relu"
hll_aux_output_bias_init: -2.0
hll_scale_hidden_dim: 32
hll_scale_activation: "relu"
hll_min_output_scale: 0.001
hll_state_value_dim: 32
hll_state_value_activation: "relu"

name: "s2q_pmix_lattice"
