# Successive Sub-value Q-learning (S2Q), adapted from the official ICLR 2026 code.
# Capacity-matched S2Q settings: preserve the three branches,
# central critic, and encoder-decoder while keeping total model
# capacity close to the QMIX/PMIX comparison budget.
# Optimisation settings match this repository's PyMARL QMIX baseline.
action_selector: "s2q_epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0
runner: "episode"
batch_size_run: 1
common_reward: True
buffer_size: 5000
batch_size: 32
optimizer: "rmsprop"
lr: 0.0005
target_update_interval: 200
agent_output_type: "q"
learner: "s2q_learner"
mac: "s2q_mac"
agent: "s2q_rnn"
double_q: True
mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64
rnn_hidden_dim: 16
obs_agent_id: True
obs_last_action: True
s2q_k: 2
s2q_temperature: 0.1
w_c: 0.9
central_action_embed: 1
central_mixing_embed_dim: 32
s2q_hidden_dim: 16
s2q_central_hidden_dim: 16
s2q_encoder_hidden_dim: 16
s2q_latent_dim: 8
s2q_central_use_agent_id: True
s2q_central_use_last_action: True
s2q_mixing_embed_dim: 16
s2q_hypernet_embed: 32
name: "s2q"
