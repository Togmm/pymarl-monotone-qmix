# S2Q with an AMCO/PMIX monotone mixer for every successive sub-value head.
# Capacity-matched S2Q settings: preserve the three branches,
# central critic, and encoder-decoder while keeping total model
# capacity close to the QMIX/PMIX comparison budget.
# The centralized unrestricted S2Q branch remains S2QCentralMixer.
# Optimisation settings match the PyMARL QMIX/PMIX SMACv1 protocol.
action_selector: "s2q_epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0
runner: "episode"
batch_size_run: 1
common_reward: True
buffer_size: 5000
batch_size: 32
optimizer: "rmsprop"
lr: 0.0005
target_update_interval: 200
agent_output_type: "q"
learner: "s2q_learner"
mac: "s2q_mac"
agent: "s2q_rnn"
double_q: True
mixer: "s2q_pmix_mlp"
rnn_hidden_dim: 16
obs_agent_id: True
obs_last_action: True

s2q_k: 2
s2q_temperature: 0.1
s2q_alpha: 1.0
w_c: 0.9
central_action_embed: 1
central_mixing_embed_dim: 32
s2q_hidden_dim: 16
s2q_central_hidden_dim: 16
s2q_encoder_hidden_dim: 16
s2q_latent_dim: 8
s2q_central_use_agent_id: True
s2q_central_use_last_action: True
s2q_mixing_embed_dim: 16
s2q_hypernet_embed: 32

mixer_diagnostics: True
credit_near_zero_threshold: 0.0001
amco_state_embed_dim: 104
amco_mono_hidden_dim: 96
amco_mono_depth: 4
amco_state_encoder_depth: 2
amco_state_activation: "silu"
amco_mono_activation: "centered_softplus"
amco_mono_softplus_beta: 2.0
amco_state_value_dim: 32
amco_state_value_activation: "relu"
amco_state_input_scale: 0.3

name: "s2q_pmix_mlp"
