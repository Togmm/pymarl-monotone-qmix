# S2Q with a MonoKAN/PMIX monotone mixer for every successive sub-value head.
# Capacity-matched S2Q settings: preserve the three branches,
# central critic, and encoder-decoder while keeping total model
# capacity close to the QMIX/PMIX comparison budget.
# The centralized unrestricted S2Q branch remains S2QCentralMixer.
# Optimisation settings match the PyMARL QMIX/PMIX SMACv1 protocol.
action_selector: "s2q_epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0
runner: "episode"
batch_size_run: 1
common_reward: True
buffer_size: 5000
batch_size: 32
optimizer: "rmsprop"
lr: 0.0005
target_update_interval: 200
agent_output_type: "q"
learner: "s2q_learner"
mac: "s2q_mac"
agent: "s2q_rnn"
double_q: True
mixer: "s2q_pmix_kan"
rnn_hidden_dim: 16
obs_agent_id: True
obs_last_action: True

s2q_k: 2
s2q_temperature: 0.1
s2q_alpha: 1.0
w_c: 0.9
central_action_embed: 1
central_mixing_embed_dim: 32
s2q_hidden_dim: 16
s2q_central_hidden_dim: 16
s2q_encoder_hidden_dim: 16
s2q_latent_dim: 8
s2q_central_use_agent_id: True
s2q_central_use_last_action: True
s2q_mixing_embed_dim: 16
s2q_hypernet_embed: 32

monokan_state_embed_dim: 32
monokan_state_embed_dim_by_map:
  MMM2: 32
  3s_vs_5z: 32
  2s3z: 32
  3s5z: 32
  1c3s5z: 32
  5m_vs_6m: 32
  bane_vs_bane: 64
  2c_vs_64zg: 64
  27m_vs_30m: 64
monokan_state_encoder_depth: 1
monokan_state_activation: "silu"
monokan_hidden_dim: 32
monokan_hidden_dim_by_map:
  bane_vs_bane: 64
  2c_vs_64zg: 64
  27m_vs_30m: 64
monokan_grid: 7
monokan_grid_by_map:
  MMM2: 7
  3s_vs_5z: 7
  2s3z: 7
  3s5z: 7
  1c3s5z: 7
  5m_vs_6m: 7
  bane_vs_bane: 7
  2c_vs_64zg: 7
  27m_vs_30m: 7
monokan_grid_min: -1.0
monokan_grid_max: 1.0
monokan_noise_scale: 0.02
monokan_min_increment: 0.0001
monokan_q_temperature: 1.0
monokan_state_value_dim: 32
monokan_state_value_activation: "relu"

name: "s2q_pmix_kan"
